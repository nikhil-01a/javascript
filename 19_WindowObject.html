<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window Object</title>
  </head>
  <body>
    <script>
      // Window holds all global properties and functions, these can be used directly as well, without "window."

      // 1. PROPERTIES //
      window.document.body.style.backgroundColor = "#000000";

      // Window heights
      let innerHeightValue = window.innerHeight;
      console.log("Inner height of the page: ", innerHeightValue);
      let outerHeightValue = window.outerHeight;
      console.log("Outer height of the page: ", outerHeightValue);
      let innerWidthValue = window.innerWidth;
      console.log("Inner Width of the page: ", innerHeightValue);
      let outerWidthValue = window.outerWidth;
      console.log("Outer Width of the page: ", outerWidthValue);

      // Window - Document Element (HTML node) heights
      let scrollHeightValue = window.document.documentElement.scrollHeight;
      console.log("Scroll height of the page: ", scrollHeightValue);
      let clientHeightValue = window.document.documentElement.clientHeight;
      console.log("Client height of the page: ", clientHeightValue);
      let offsetHeightValue = window.document.documentElement.offsetHeight;
      console.log("Offset height of the page: ", offsetHeightValue);

      // Window - Location properties
      let fullPathObj = window.location.href;
      let hostnameObj = window.location.hostname;
      let portNumberObj = window.location.port;
      let pathNameobj = window.location.pathname;
      console.log("Full Path: ", fullPathObj);
      console.log("Host name: ", hostnameObj);
      console.log("Port number: ", portNumberObj);
      console.log("Path name: ", pathNameobj);

      // 2. FUNCTIONS //

      // Window Global functions
      let name = window.prompt("Please enter your name: ");
      let nameBoolean = window.confirm(`Is your name really ${name}?`);
      if (nameBoolean) window.alert(`Hi ${name}!`);
      else window.alert("You're not welcome here!");

      // Each setTimeout timer starts immediately when the page loads, this is classic example of why would need either asyn - await or promisses in future!
      // Also for some reason the timer starts after the alert, prompt and confirm dialog box functions, just an observation. These three functions freeze the timer indeed.

      // open()
      setTimeout(() => {
        let windowReference = window.open("18_Timers.html", "", "resizable=yes");
        // resizeTo()
        setTimeout(() => {
          windowReference.resizeTo(600, 400);
        }, 3000);

        // moveTo()
        setTimeout(() => {
          windowReference.moveTo(100, 100);
        }, 6000);

        // close()
        setTimeout(() => {
          console.log("closing project!");
          windowReference.close();
        }, 9000);
      }, 3000);

      // Window - Location functions
      // reload() will start everything from the beginning so commenting it
      // setTimeout(() => {
      //   console.log("Refreshing current page!");
      //   window.location.reload();
      // }, 15000);
      setTimeout(() => {
        console.log("Redirecting this page to Digital Clock!");
        window.location.assign("Project2-DigitalClock/index.html");
      }, 18000);

      // Window - History functions
      // We would back() in Digital Clock page to come back and then forward from this page again. But we get the idea of what these functions do, so yea.
      // setTimeout(() => {
      //   console.log("Going back!");
      //   window.history.back();
      // }, 21000);
      // setTimeout(() => {
      //   console.log("Going forward!");
      //   window.history.forward();
      // }, 24000);
      // setTimeout(() => {
      //   console.log("Going back again!");
      //   window.history.back();
      // }, 27000);
    </script>
  </body>
</html>
